.bar2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px;align-items:center}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.bar2 input,.bar2 select{width:auto;flex:1;min-width:120px}
label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px;font-weight:600}
.p,.s{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.p{background:var(--g);color:#fff}:root[data-theme="dark"] .p,:root:not([data-theme="light"]) .p{color:#06210f}

.co{cursor:pointer}.co b{font-size:16px}.note{font-size:12px;color:var(--mute)}

.mini div b{display:block;color:var(--g)}
.flow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0;font-weight:700}
.flow span{background:var(--g2);color:var(--g);padding:6px 12px;border-radius:20px}
.quote{text-align:center;font-size:20px;font-weight:800;padding:20px;background:linear-gradient(120deg,var(--g2),var(--card));border-radius:16px;margin:12px 0}
@keyframes sp{to{transform:rotate(360deg)}}.spin{transform-origin:50% 50%;animation:sp 40s linear infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{aside,#bn,.top,.bar2,.noprint{display:none!important}.main{padding:0}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:1px}
